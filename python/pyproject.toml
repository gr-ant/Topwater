[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topwater"
version = "0.1.0"
description = "Give your agent one `bash` tool backed by a simulated Linux shell and your own Python tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
