[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "topwater-python"
version = "0.1.0"
description = "The interpreter behind Topwater's opt-in python3 command: CPython 3.14 compiled to WebAssembly, run by wasmtime."
readme = "README.md"
license = "MIT AND PSF-2.0 AND Zlib AND blessing AND BSD-2-Clause AND (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT)"
license-files = ["LICENSE", "src/topwater_python/interpreter/THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
# the core package stays dependency-free: this one carries the ~8 MB interpreter and the runtime. The release pins topwater
# to this same version; wasmtime to the major version the tests ran (its compiled modules and C API change per major)
dependencies = ["topwater==0.1.0", "wasmtime>=51,<52"]

[project.urls]
Homepage = "https://github.com/gr-ant/Topwater"
Repository = "https://github.com/gr-ant/Topwater"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
topwater_python = ["interpreter/*"]
