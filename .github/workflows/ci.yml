name: CI

on:
  push:
  pull_request:

# All three implementations run the shared corpus in tests/corpus.
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # spec/ must satisfy its JSON schemas, and the ports' generated tables must match it (see spec/README.md)
      - run: python3 tools/spec-gen/gen.py --check
      - run: python3 tools/spec-gen/test_gen.py
      # the three ports keep the same files, sections and command order (docs/architecture.md)
      - run: python3 tools/check_layout.py --self-test && python3 tools/check_layout.py

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test --configuration Release

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The container image (docker/Dockerfile) on linux/amd64 and linux/arm64, each built from a standalone binary as the
  # release does and smoke-tested on its own architecture: a run, an MCP session over stdio, --state, a non-root user.
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, arch: amd64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the image
        run: |
          dotnet publish src/Topwater.Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -o pub
          mkdir -p ctx/linux-${{ matrix.arch }} && cp pub/Topwater.Cli ctx/linux-${{ matrix.arch }}/topwater
          docker buildx build --load --platform linux/${{ matrix.arch }} -f docker/Dockerfile -t topwater:ci ctx
      - run: docker/smoke-test.sh topwater:ci

  # The standalone topwater binary on each desktop system, and the install scripts' syntax.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Standalone binary runs
        shell: bash
        run: |
          dotnet publish src/Topwater.Cli -c Release --use-current-runtime --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -o standalone
          out=$(./standalone/Topwater.Cli run 'echo ok; printf "%s\\n" a b | wc -l' | tr -d '\r')
          echo "$out"; [ "$out" = "$(printf 'ok\n2')" ]
          mkdir -p "$RUNNER_TEMP/out"
          ./standalone/Topwater.Cli run --export /tmp/x:"$RUNNER_TEMP/out" 'mkdir -p /tmp/x && echo hi > /tmp/x/f'
          [ "$(tr -d '\r' < "$RUNNER_TEMP/out/f")" = hi ]
      - name: install.sh is valid
        if: runner.os != 'Windows'
        run: sh -n install/install.sh
      - name: install.ps1 parses
        shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw install/install.ps1))
