name: Release

# Push a tag like v0.1.0-preview.1 or v0.1.0 to build, test and publish all three packages.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test --configuration Release
      - name: Pack (version comes from the tag)
        run: |
          v="${GITHUB_REF_NAME#v}"
          prefix="${v%%-*}"; suffix=""; [ "$v" != "$prefix" ] && suffix="${v#*-}"
          for p in src/Topwater src/Topwater.AI src/Topwater.Mcp; do
            dotnet pack "$p" -c Release -o out -p:VersionPrefix="$prefix" -p:VersionSuffix="$suffix"
          done
      - name: Publish to nuget.org
        run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
