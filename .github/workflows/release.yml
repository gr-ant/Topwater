name: Release

# Push a tag like v0.1.0-preview.1 or v0.1.0 to build, test and publish all the packages.
on:
  push:
    tags: ['v*']

# NuGet, and when switched on PyPI and npm (jobs pypi and npm), publish with trusted publishing: no stored API key. A policy on nuget.org (owner gr-ant, repository
# Topwater, workflow release.yml) lets this workflow exchange its GitHub OIDC token for a one-hour NuGet key.
jobs:
  publish:
    needs: [binaries, python-package, npm-package]   # the NuGet push cannot be undone: only after every binary built and every port's tests passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job request a GitHub OIDC token for NuGet/login
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - run: dotnet test --configuration Release
      - name: Pack (version comes from the tag)
        run: |
          v="${GITHUB_REF_NAME#v}"
          prefix="${v%%-*}"; suffix=""; [ "$v" != "$prefix" ] && suffix="${v#*-}"
          for p in src/Topwater src/Topwater.AI src/Topwater.Mcp src/Topwater.Containers src/Topwater.Replay src/Topwater.Cli; do
            dotnet pack "$p" -c Release -o out -p:VersionPrefix="$prefix" -p:VersionSuffix="$suffix"
          done
      - name: NuGet login (OIDC to a one-hour API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not the email address
      - name: Publish to nuget.org
        run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

  # Standalone topwater binaries (no .NET needed) for the install scripts in install/, attached to the GitHub release.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Publish ${{ matrix.rid }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          prefix="${v%%-*}"; suffix=""; [ "$v" != "$prefix" ] && suffix="${v#*-}"
          dotnet publish src/Topwater.Cli -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None -p:GenerateDocumentationFile=false \
            -p:VersionPrefix="$prefix" -p:VersionSuffix="$suffix" -o pub
          mkdir dist
          case ${{ matrix.rid }} in
            win-*) mv pub/Topwater.Cli.exe pub/topwater.exe; (cd pub && zip -q ../dist/topwater-${{ matrix.rid }}.zip topwater.exe) ;;
            *) mv pub/Topwater.Cli pub/topwater; chmod 755 pub/topwater; tar -czf dist/topwater-${{ matrix.rid }}.tar.gz -C pub topwater ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: topwater-${{ matrix.rid }}
          path: dist/*

  # The Python package, tested and built on every release with no publishing rights. pypi uploads exactly these files.
  python-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pytest build twine
      - run: python -m pytest -q
      - name: Set the version from the tag
        # v0.1.0-preview.4 -> 0.1.0a4 (PEP 440 alpha; plain "preview" would normalize to rc4), v0.1.0 -> 0.1.0
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-preview\.(0|[1-9][0-9]*))?$ ]] || { echo "no PEP 440 form for $v" >&2; exit 1; }
          py="${BASH_REMATCH[1]}${BASH_REMATCH[6]:+a${BASH_REMATCH[6]}}"
          sed -i "s/^version = \".*\"/version = \"$py\"/" pyproject.toml
          grep -x "version = \"$py\"" pyproject.toml
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package
          path: python/dist/*
          if-no-files-found: error

  # The npm package, tested and packed on every release with no publishing rights. npm publishes exactly this tarball.
  npm-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set the version from the tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm pack   # builds through prepack and lists the files
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: typescript/topwater-*.tgz
          if-no-files-found: error

  # PyPI trusted publishing: a publisher on pypi.org (project topwater, owner gr-ant, repository Topwater, workflow
  # release.yml, no environment) accepts this job's OIDC token. Off until the repository variable PUBLISH_PYPI is 'true'.
  # No checkout and no repository code here: the only step is the upload.
  pypi:
    needs: [publish, python-package]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for the PyPI OIDC exchange
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # first upload only: an API token while the PyPI project does not exist yet; empty (secret removed) means
          # trusted publishing through this job's OIDC token, which is the steady state
          password: ${{ secrets.PYPI_API_TOKEN }}

  # npm trusted publishing: npm accepts this job's OIDC token for the package topwater (repository gr-ant/Topwater,
  # workflow release.yml) and adds provenance. Off until the repository variable PUBLISH_NPM is 'true'.
  # No checkout, no install and no scripts here: the only code that runs is npm publishing the tarball.
  npm:
    needs: [publish, npm-package]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for the npm OIDC exchange and provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24   # its npm is 11.5.1 or later, which trusted publishing needs
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          # OIDC first; NPM_TOKEN only for the very first publish, before the package exists to trust this workflow
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest; case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish ./topwater-*.tgz --ignore-scripts --provenance --access public --tag "$tag"

  # The container image ghcr.io/gr-ant/topwater for linux/amd64 and linux/arm64, made from the binaries job's Linux
  # binaries: docker/Dockerfile only copies them in, so there is no emulation and no repository code runs here.
  # Tags: the version, preview (the newest release of any kind) and, for a tag without a "-" suffix, latest.
  # Not gated by a variable: GHCR needs no account, publisher or secret, only this job's GITHUB_TOKEN, and an image
  # can be deleted or re-tagged later. After the first push, set the package's visibility to public once.
  docker:
    needs: [publish, binaries]   # after every port's tests passed and NuGet has the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io/gr-ant/topwater
      id-token: write       # sign the build provenance attestation (Sigstore)
      attestations: write   # store it with the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: topwater-linux-*
          path: dl
          merge-multiple: true
      - name: Build context and tags
        id: meta
        run: |
          for a in x64:amd64 arm64:arm64; do
            mkdir -p "ctx/linux-${a#*:}"
            tar -xzf "dl/topwater-linux-${a%:*}.tar.gz" -C "ctx/linux-${a#*:}"
          done
          v="${GITHUB_REF_NAME#v}"; img=ghcr.io/gr-ant/topwater
          tags="$img:$v,$img:preview"; case "$v" in *-*) ;; *) tags="$tags,$img:latest" ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/gr-ant/Topwater
            index:org.opencontainers.image.description=A simulated bash shell for AI agents: an interactive shell, one-shot runs and an MCP server with a sandboxed bash tool
            index:org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: Signed provenance (gh attestation verify oci://ghcr.io/gr-ant/topwater:<version> -R gr-ant/Topwater)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gr-ant/topwater
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false   # storage records are for organization accounts

  github-release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job can create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: topwater-*   # the six binaries, not python-package or npm-package
          path: dist
          merge-multiple: true
      - name: Create the release with the binaries and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum topwater-* > SHA256SUMS && cat SHA256SUMS
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre topwater-* SHA256SUMS
